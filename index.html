<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUSK MOONSHOT PATTERN | $MUSKPAT</title>
    <meta
      name="description"
      content="Explore MUSK MOONSHOT PATTERN, an Ethereum community meme project inspired by moonshot thinking, trading culture and the journey from Earth to Mars and beyond."
    />
    <meta name="theme-color" content="#020714" />
    <link rel="canonical" href="https://muskpat.site/" />
    <meta property="og:title" content="MUSK MOONSHOT PATTERN | $MUSKPAT" />
    <meta
      property="og:description"
      content="Explore MUSK MOONSHOT PATTERN, an Ethereum community meme project inspired by moonshot thinking, trading culture and the journey from Earth to Mars and beyond."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://muskpat.site/" />
    <meta property="og:image" content="https://muskpat.site/images/muskpat-banner-1100x520.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MUSK MOONSHOT PATTERN | $MUSKPAT" />
    <meta
      name="twitter:description"
      content="Explore MUSK MOONSHOT PATTERN, an Ethereum community meme project inspired by moonshot thinking, trading culture and the journey from Earth to Mars and beyond."
    />
    <meta name="twitter:image" content="https://muskpat.site/images/muskpat-banner-1100x520.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%images/muskpat-logo-icon-transparent.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%images/muskpat-logo-icon-transparent.png" />
    <link rel="preload" as="image" href="%BASE_URL%images/muskpat-preview-concept-main.jpg" />
    <style>
      .arrival {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        background: #020714;
      }
      .arrival img {
        width: min(100%, calc(100dvh - 88px));
        height: auto;
        max-height: calc(100dvh - 88px);
        object-fit: contain;
        background: #020714;
      }
      .arrival-bar {
        display: flex;
        justify-content: center;
      }
      .arrival-enter {
        min-height: 46px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        color: #04140a;
        background: linear-gradient(180deg, #86ff8e, #24ff41);
        box-shadow: 0 0 0 1px rgba(84, 255, 98, 0.4), 0 0 18px rgba(84, 255, 98, 0.28);
        font-family: Orbitron, sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        cursor: pointer;
      }
      .arrival-enter:focus-visible { outline: 2px solid #54ff62; outline-offset: 3px; }
      .arrival .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .arrival[hidden] { display: none; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="arrival" id="arrival" role="dialog" aria-modal="true" aria-labelledby="arrival-title">
      <h1 id="arrival-title" class="sr-only">MUSK MOONSHOT PATTERN</h1>
      <img
        src="%BASE_URL%images/muskpat-preview-concept-main.jpg"
        alt="Mission-control concept art for MUSK MOONSHOT PATTERN, $MUSKPAT."
        width="1024"
        height="1024"
        fetchpriority="high"
      />
      <div class="arrival-bar">
        <button class="arrival-enter" id="arrival-enter" type="button">ENTER THE MISSION</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var arrival = document.getElementById("arrival");
        var enter = document.getElementById("arrival-enter");
        document.body.style.overflow = "hidden";
        function closeArrival() {
          arrival.hidden = true;
          document.body.style.overflow = "";
          document.getElementById("main")?.focus();
        }
        enter.addEventListener("click", closeArrival);
        window.addEventListener("keydown", function (event) {
          if (!arrival.hidden && event.key === "Escape") closeArrival();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
